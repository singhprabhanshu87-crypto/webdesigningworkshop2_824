<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 350px;
        }

        h2 {
            color: #333;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Factorial Calculator</h2>
        <input type="number" id="number" placeholder="Enter a non-negative number">
        <br>
        <button onclick="calculateFactorial()">Calculate</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateFactorial() {
            const num = parseInt(document.getElementById("number").value);
            const resultDiv = document.getElementById("result");

            if (isNaN(num) || num < 0) {
                resultDiv.innerHTML = "Please enter a valid non-negative number.";
                return;
            }

            let factorial = 1;

            // Calculate factorial using a loop
            for (let i = 1; i <= num; i++) {
                factorial *= i;
            }

            resultDiv.innerHTML = `Factorial of ${num} is ${factorial}`;
        }
    </script>

</body>
</html>
